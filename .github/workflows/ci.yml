name: ORVION CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Python Backend Tests
  api-test:
    name: API Tests (Python)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: orvion_test
          POSTGRES_USER: orvion
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black flake8 mypy
    
    - name: Lint with flake8
      run: |
        flake8 orvion/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 orvion/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
    
    - name: Format check with black
      run: |
        black --check orvion/ *.py || true
    
    - name: Type check with mypy
      run: |
        mypy orvion/ --ignore-missing-imports || true
    
    - name: Run API tests
      env:
        DATABASE_URL: postgresql://orvion:test_password@localhost:5432/orvion_test
        JWT_SECRET: test-secret-key-for-ci
        ORVION_ENV: test
      run: |
        python -m pytest tests/ -v --cov=orvion --cov-report=xml --cov-report=html || true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Solidity Smart Contract Tests
  contract-test:
    name: Contract Tests (Solidity)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install
        npm install --save-dev hardhat @nomicfoundation/hardhat-toolbox chai ethers
    
    - name: Compile contracts
      run: npx hardhat --config hardhat.config.cjs compile
    
    - name: Run contract tests
      run: npx hardhat --config hardhat.config.cjs test tests/Orvion.test.js || true
    
    - name: Run settlement integration tests
      run: python -m pytest tests/test_settlement_integration.py -v || true

  # SDK Tests
  sdk-test:
    name: SDK Tests (Python)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install SDK dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3 tenacity pytest
    
    - name: Test SDK import
      run: python -c "from orvion_sdk import OrvionAgentSDK; print('✅ SDK OK')"
    
    - name: Test SDK Enhanced import
      run: python -c "from orvion_sdk_enhanced import OrvionAgentSDK; print('✅ SDK Enhanced OK')"
    
    - name: Run SDK unit tests
      run: |
        python -m pytest tests/test_sdk.py -v || true

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: bandit -r orvion/ -f json -o bandit-report.json || true
    
    - name: Check dependencies for vulnerabilities
      run: safety check --json || true

  # Build Docker image
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api-test, contract-test, sdk-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: orvion:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install tools
      run: |
        pip install pylint radon
    
    - name: Run Pylint
      run: pylint orvion/ --exit-zero || true
    
    - name: Calculate code complexity
      run: radon cc orvion/ -a || true

  # Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [api-test, contract-test, sdk-test, security-scan, docker-build, code-quality]
    if: always()
    
    steps:
    - name: Check job status
      run: |
        if [ "${{ needs.api-test.result }}" = "failure" ] || [ "${{ needs.contract-test.result }}" = "failure" ]; then
          echo "⚠️ Some tests failed - check logs"
        else
          echo "✅ Pipeline completed"
        fi
