name: OMNI PIPELINE (CI + SECURITY + RELEASE + DEPLOY)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PYTHON_VERSION: 3.11

jobs:

  # =========================
  # 1. CHECKOUT + SETUP
  # =========================
  setup:
    runs-on: ubuntu-latest

    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-build-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}" >> $GITHUB_OUTPUT

  # =========================
  # 2. NODE (WEB / PWA)
  # =========================
  node:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Test
        run: npm test || true

      - name: Build
        run: npm run build || true

  # =========================
  # 3. PYTHON (API / FASTAPI)
  # =========================
  python:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pip-audit

      - name: Security scan (pip-audit)
        run: pip-audit || true

      - name: Run tests
        run: pytest || true

  # =========================
  # 4. CODEQL (SECURITY)
  # =========================
  codeql:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # =========================
  # 5. DOCKER BUILD (OPTIONAL)
  # =========================
  docker:
    runs-on: ubuntu-latest
    needs: [node, python]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pocket-oracle:latest . || true

  # =========================
  # 6. RELEASE AUTOMÁTICO
  # =========================
  release:
    runs-on: ubuntu-latest
    needs: [node, python, codeql]

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

  # =========================
  # 7. DEPLOY (SAFE)
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: [release]

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "🚀 Deploy stage ready"
          echo "Conecte aqui com Vercel, Railway, VPS ou Kubernetes"
