name: Java CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify project structure
        run: |
          echo "Project is Node.js/Python based — no Java/Maven build required."
          echo "Java pipeline is a placeholder for future Java SDK integration."

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t orvion:latest . || true
