version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pocket-oracle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocket_oracle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pocket_oracle_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pocket-oracle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pocket_oracle_redis:/data

volumes:
  pocket_oracle_postgres:
  pocket_oracle_redis:
