version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: orvion-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: orvion-postgres
    environment:
      POSTGRES_USER: orvion
      POSTGRES_PASSWORD: orvion
      POSTGRES_DB: orvion
    ports:
      - "5432:5432"
    volumes:
      - orvion-pg:/var/lib/postgresql/data
    restart: unless-stopped

  sensor-orchestrator:
    build:
      context: ../../services/sensor-orchestrator
    container_name: orvion-sensor-orchestrator
    ports:
      - "8100:8100"
    restart: unless-stopped

volumes:
  orvion-pg:
