global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'orvion-gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: '/metrics'

  - job_name: 'orvion-auth'
    static_configs:
      - targets: ['auth:3001']
    metrics_path: '/health'

  - job_name: 'orvion-billing'
    static_configs:
      - targets: ['billing:3002']
    metrics_path: '/health'

  - job_name: 'orvion-usage'
    static_configs:
      - targets: ['usage:3003']
    metrics_path: '/health'

  - job_name: 'orvion-circle'
    static_configs:
      - targets: ['circle-payments:3004']
    metrics_path: '/health'
