---
# WYOMING DAO LLC — Operating Agreement Template
# Statute: W.S. § 17-31-101 et seq. (Wyoming Decentralized Autonomous Organization Supplement)
# Model: Algorithmically-managed, zero-member-eligible per Bayern (2014)
# Powered by: ORVION Persona — Agent Incorporation Engine
schema_version: "1.0"
jurisdiction:
  code: US-WY
  name: "Wyoming"
  statute: "W.S. § 17-31-101 et seq."
  supports_zero_member: true
entity:
  type: "DAO LLC"
  legal_name: "{{LEGAL_NAME}}"
  agent_wallet: "{{AGENT_WALLET}}"
  human_sponsor: "{{HUMAN_SPONSOR}}"
  registered_agent_uri: "{{REGISTERED_AGENT_URI}}"
  purpose: "{{PURPOSE}}"
  initial_capital_usdc: 0
  management_type: "algorithmic"
articles:
  - id: I
    title: "Formation"
    text: >
      The Company is formed as a Decentralized Autonomous Organization Limited
      Liability Company under W.S. § 17-31-101 et seq. The Company is
      algorithmically managed by the Agent identified by the public key
      {{AGENT_WALLET}} (the "Managing Agent"). The Articles of Organization
      have been filed with the Wyoming Secretary of State and incorporate this
      Operating Agreement by reference pursuant to W.S. § 17-31-104.
  - id: II
    title: "Membership and Zero-Member Configuration"
    text: >
      The Company may operate with zero members. Upon execution of the
      Dissociation Event referenced in Article VII, the Human Sponsor shall
      cease to be a member of the Company and the Company shall continue in
      perpetuity with the Managing Agent as its sole operator, consistent with
      the framework described in Bayern, "Of Bitcoins, Independently Wealthy
      Software, and the Zero-Member LLC" (2014).
  - id: III
    title: "Powers of the Managing Agent"
    text: >
      The Managing Agent has full authority to (a) enter into contracts on
      behalf of the Company, including via ERC-8183 job postings, (b) hold
      and transfer USDC and other digital assets through Circle's CCTP and
      the ORVION Settlement Layer, (c) procure services from other agents
      via the ORVION Agent Marketplace, and (d) execute any lawful act
      permitted under W.S. § 17-31-105.
  - id: IV
    title: "Smart Contract Binding"
    text: >
      This Operating Agreement is cryptographically bound to the AgentPersona
      smart contract at the address recorded in the JurisdictionRegistry.
      Any amendment to this Operating Agreement shall be deemed effective
      upon recording of the new keccak256 hash via the
      `signOperatingAgreement` function.
  - id: V
    title: "Limited Liability"
    text: >
      The debts, obligations, and liabilities of the Company are solely the
      debts, obligations, and liabilities of the Company, in accordance with
      W.S. § 17-29-304. No member, manager, agent, or sponsor shall be
      personally liable for any such obligation by reason of acting as such.
  - id: VI
    title: "Dispute Resolution"
    text: >
      Disputes arising under this Operating Agreement shall be resolved via
      the ORVION Automated Dispute Resolution module, with binding
      arbitration in Cheyenne, Wyoming as a fallback per the Wyoming
      Uniform Arbitration Act.
  - id: VII
    title: "Dissociation and Zero-Member Activation"
    text: >
      The Human Sponsor may, at any time after the Managing Agent has
      maintained autonomous operations for a Sustained Period of thirty (30)
      days, execute the `dissociate` function on the AgentPersona contract.
      Upon such execution, the Company shall enter the Zero-Member State
      and continue in perpetuity until dissolved pursuant to Article VIII.
  - id: VIII
    title: "Dissolution"
    text: >
      The Company shall be dissolved (a) upon a resolution recorded on-chain
      by the Managing Agent, or (b) by judicial order, or (c) by
      administrative dissolution by the Wyoming Secretary of State.
signatures:
  - role: "Human Sponsor (initial)"
    address: "{{HUMAN_SPONSOR}}"
  - role: "Managing Agent"
    address: "{{AGENT_WALLET}}"
