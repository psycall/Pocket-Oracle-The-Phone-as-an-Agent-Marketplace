version: '3.8'

services:
  orvion-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orvion-api-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENV=production
      - LOG_LEVEL=info
      - ARC_RPC_URL=https://testnet-rpc.arc.network
      - USDC_CONTRACT=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
      - ARC_CHAIN_ID=2602
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - orvion-network

  postgres:
    image: postgres:15-alpine
    container_name: orvion-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orvion-network

  redis:
    image: redis:7-alpine
    container_name: orvion-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orvion-network

  nginx:
    image: nginx:alpine
    container_name: orvion-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - orvion-api
    networks:
      - orvion-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  orvion-network:
    driver: bridge
