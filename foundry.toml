[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "contracts/test"
cache_dir = "cache"

# Compiler settings
solc_version = "0.8.20"
optimizer_runs = 200
optimizer = true

# Test settings
fuzz_runs = 256
fuzz_max_test_rejects = 65536

# Fork settings
fork_url = "https://rpc.testnet.arc.network"
fork_block_number = 0

# Gas settings
gas_reports = ["OrvionEscrow", "OrvionSettlement"]

[profile.ci]
fuzz_runs = 10000
