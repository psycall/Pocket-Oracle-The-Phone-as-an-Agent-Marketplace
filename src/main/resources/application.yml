spring:
  application:
    name: orvion-settlement-layer
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orvion}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

server:
  port: ${API_PORT:8080}
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    io.orvion: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

orvion:
  arc:
    rpc-url: ${ARC_RPC_URL:https://testnet-rpc.arc.network}
    chain-id: ${ARC_CHAIN_ID:2602}
    contract-address: ${ORVION_CONTRACT_ADDRESS}
  circle:
    api-key: ${CIRCLE_API_KEY}
    entity-secret: ${CIRCLE_ENTITY_SECRET}
    api-url: ${CIRCLE_API_URL:https://api.circle.com}
  nanopayments:
    batch-size: ${NANOPAYMENTS_BATCH_SIZE:1000}
    settlement-interval: ${SETTLEMENT_INTERVAL:300}
